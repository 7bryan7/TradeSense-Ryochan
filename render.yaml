services:
  - type: web
    name: tradesense-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build:packages && npm run build -w @tradesense/server
    startCommand: npm run start -w @tradesense/server
    healthCheckPath: /api/health
    disk:
      name: tradesense-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATA_MODE
        value: live
      - key: DATABASE_PATH
        value: /var/data/tradesense.sqlite
      - key: WEB_ORIGIN
        sync: false
      - key: RYO_MCP_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: SCHEDULER_ENABLED
        value: "false"
